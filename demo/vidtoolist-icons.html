<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidTooList — linear marks</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0d0f; color: #ECE9E2; font-family: Heebo, sans-serif; padding: 18px 12px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  header.top h1 { font-size: 21px; margin: 0; flex: 1; }
  button.lang { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid #fff3; background: #1b1c1f; color: #fff; cursor: pointer; }
  p.lead { margin: 0 0 16px; color: #9a968e; font-size: 14.5px; line-height: 1.55; max-width: 780px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 14px; }
  .opt { background: #1b1c1f; border: 1px solid #2f3135; border-radius: 16px; padding: 14px; }
  .opt h3 { margin: 10px 0 2px; font-size: 15.5px; }
  .opt p { margin: 0; color: #9a968e; font-size: 13px; line-height: 1.5; }
  .tag { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: #2b2114; color: #F2A33A; margin-top: 8px; }
  .icons { display: flex; gap: 12px; justify-content: center; align-items: flex-end; direction: ltr; }
  .ico { width: 96px; height: 96px; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 24px -12px #000; }
  .ico.dark { background: linear-gradient(160deg, #2a2c30, #131416); box-shadow: inset 0 1px 0 #ffffff14, 0 12px 24px -12px #000; }
  .ico.light { background: linear-gradient(160deg, #f7f6f2, #dedbd4); }
  .ico.sm { width: 56px; height: 56px; border-radius: 13px; }
  .ico svg { width: 100%; height: 100%; display: block; }
  .lbl { text-align: center; font-size: 11px; color: #9a968e; margin-top: 5px; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1 data-he="VidTooList · סמל לינארי" data-en="VidTooList · a linear mark">VidTooList · סמל לינארי</h1>
  <button class="lang" id="lang">English</button>
</header>
<p class="lead" data-he="כמו שביקשת: הסמל בנוי מקווים, כמו הסקאלה של העדשה או של הצמצם, באותה שפה של השם B2. כל סמל מוצג גדול על גרפיט, גדול על כסוף, וקטן כמו אייקון של אפליקציית כלי." data-en="As you asked: the mark is built from lines, like a lens or iris scale, in name B2's language. Each is shown large on graphite, large on silver, and small as a tool-app icon.">כמו שביקשת: הסמל בנוי מקווים, כמו הסקאלה של העדשה או של הצמצם, באותה שפה של השם B2. כל סמל מוצג גדול על גרפיט, גדול על כסוף, וקטן כמו אייקון של אפליקציית כלי.</p>
<div class="grid" id="marks"></div>
</div>
<script>
// the engraved ∞: a true lemniscate, centred on (12,6) in a 24-wide box
const LEM = (() => { const p = []; for (let i = 0; i <= 72; i++) { const t = i / 72 * 2 * Math.PI, d = 1 + Math.sin(t) ** 2; p.push(`${(12 + 11 * Math.cos(t) / d).toFixed(2)} ${(6 + 13.75 * Math.sin(t) * Math.cos(t) / d).toFixed(2)}`); } return `M${p.join(' L')}Z`; })();
const inf = (cx, cy, w, sw, c) => { const k = w / 22; return `<path transform="translate(${cx - 12 * k} ${cy - 6 * k}) scale(${k})" d="${LEM}" fill="none" stroke="${c}" stroke-width="${sw / k}" stroke-linejoin="round"/>`; };
// a straight scale: minor ticks every `step`, majors every 5
const ticks = (x0, x1, y, step, h, hMaj, c, up = false) => { let s = ''; let n = 0; for (let x = x0; x <= x1 + .01; x += step, n++) { const L = n % 5 === 0 ? hMaj : h; s += `<line x1="${x.toFixed(1)}" y1="${y}" x2="${x.toFixed(1)}" y2="${up ? y - L : y + L}" stroke="${c}" stroke-width="${n % 5 === 0 ? 2.2 : 1.4}"/>`; } return s; };
const iMark = (x, y0, y1, dotY, c, w = 5) => `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${c}" stroke-width="${w}" stroke-linecap="butt"/><circle cx="${x}" cy="${dotY}" r="${w * .82}" fill="${c}"/>`;
const F = "'Barlow Condensed', sans-serif";
const MARKS = [
  { pick: true, he: ['L1 · סקאלת פוקוס', 'פס של שנתות כמו על טבעת פוקוס, ה-∞ באמצע, וה-i הכתום מתחת כקו הסימון. הכי קרוב לשם B2.'], en: ['L1 · Focus scale', 'A band of ticks like a focus ring, the ∞ in the middle, and the amber i below as the witness line. Closest to name B2.'],
    draw: (fg, mut, A) => ticks(14, 106, 34, 4.6, 6, 12, mut) + inf(60, 58, 46, 3.4, fg) + iMark(60, 76, 100, 74, A, 4.6).replace(/cy="74"/, 'cy="76"') },
  { pick: true, he: ['L2 · שתי טבעות', 'טבעת פוקוס למעלה וטבעת צמצם למטה, עם שני ה-i כסימונים: אחד מצביע למעלה, אחד למטה. B2 המלא בתוך ריבוע.'], en: ['L2 · Two rings', 'A focus ring above and an iris ring below, with the two i\'s as marks: one points up, one down. The whole of B2 in a square.'],
    draw: (fg, mut, A) => ticks(12, 108, 22, 4.8, 5, 10, mut) + inf(60, 60, 50, 3.6, fg) + ticks(12, 108, 98, 4.8, 5, 10, mut, true) + iMark(38, 34, 50, 40, A, 4).replace(/cy="40"/, 'cy="36"') + iMark(82, 70, 86, 84, A, 4) },
  { he: ['L3 · סקאלת צמצם', 'ערכי T חרוטים בשורה (2 · 2.8 · 4), מעליהם ה-∞, וה-i מסמן את ה-2.8. נראה כמו טבעת צמצם אמיתית.'], en: ['L3 · Iris scale', 'T-stops engraved in a row (2 · 2.8 · 4), the ∞ above, and the i marking 2.8. Reads like a real iris ring.'],
    draw: (fg, mut, A) => inf(60, 40, 52, 3.6, fg) + `<line x1="12" y1="70" x2="108" y2="70" stroke="${mut}" stroke-width="1.6"/>` + ticks(14, 106, 70, 9.2, 5, 9, mut)
      + `<text x="30" y="98" font-family="${F}" font-size="15" fill="${mut}" text-anchor="middle">2</text><text x="60" y="98" font-family="${F}" font-size="15" fill="${A}" text-anchor="middle">2.8</text><text x="90" y="98" font-family="${F}" font-size="15" fill="${mut}" text-anchor="middle">4</text>`
      + `<line x1="60" y1="58" x2="60" y2="80" stroke="${A}" stroke-width="3"/>` },
  { he: ['L4 · ה-i כקו עד בלבד', 'הכי מינימלי: ∞ ומתחתיו ה-i הכתום, עם שנתות קצרות משני הצדדים. נקי מאוד בגודל קטן.'], en: ['L4 · Just the i as witness', 'The most minimal: ∞ with the amber i below, short ticks either side. Very clean when small.'],
    draw: (fg, mut, A) => inf(60, 48, 58, 4, fg) + ticks(16, 44, 86, 7, 6, 6, mut) + ticks(76, 104, 86, 7, 6, 6, mut) + iMark(60, 78, 104, 70, A, 5) },
  { he: ['L5 · פריים לינארי', 'הסמל המקורי שאהבת (פריים ו-∞), אבל הפינות בנויות משנתות של סקאלה במקום קווים מלאים.'], en: ['L5 · Linear frame', 'Your favourite original (frame and ∞), but the corners are built from scale ticks instead of solid lines.'],
    draw: (fg, mut, A) => { let s = ''; for (let i = 0; i < 6; i++) { s += `<line x1="${18 + i * 5}" y1="${102}" x2="${18 + i * 5}" y2="${i === 0 ? 74 : 96}" stroke="${A}" stroke-width="2.4"/><line x1="${102 - i * 5}" y1="18" x2="${102 - i * 5}" y2="${i === 0 ? 46 : 24}" stroke="${A}" stroke-width="2.4"/>`; } return s + `<line x1="18" y1="102" x2="46" y2="102" stroke="${A}" stroke-width="2.4"/><line x1="74" y1="18" x2="102" y2="18" stroke="${A}" stroke-width="2.4"/>` + inf(60, 60, 50, 3.6, fg); } },
  { he: ['III · הסמל המקורי', 'להשוואה: פריים ו-∞.'], en: ['III · The original mark', 'For comparison: frame and ∞.'],
    draw: (fg, mut, A) => `<path d="M20 74 V100 H46" fill="none" stroke="${A}" stroke-width="7"/><path d="M74 20 H100 V46" fill="none" stroke="${A}" stroke-width="7"/>` + inf(60, 60, 46, 4, fg) },
];
const svg = (m, mode) => { const fg = mode === 'dark' ? '#ECE9E2' : '#1d1e21', mut = mode === 'dark' ? '#8f8b84' : '#8a867e', A = mode === 'dark' ? '#F2A33A' : '#D97A00'; return `<svg viewBox="0 0 120 120">${m.draw(fg, mut, A)}</svg>`; };
const T = (he, en) => `data-he="${he.replace(/"/g, '&quot;')}" data-en="${en.replace(/"/g, '&quot;')}"`;
document.getElementById('marks').innerHTML = MARKS.map(m => `<div class="opt"><div class="icons">
    <div><div class="ico dark">${svg(m, 'dark')}</div><div class="lbl">VidTooList</div></div>
    <div><div class="ico light">${svg(m, 'light')}</div><div class="lbl" ${T('כסוף', 'Silver')}>כסוף</div></div>
    <div><div class="ico dark sm">${svg(m, 'dark')}</div><div class="lbl">Lens</div></div></div>
  ${m.pick ? `<span class="tag" ${T('בין המומלצים', 'Recommended')}>בין המומלצים</span>` : ''}
  <h3 ${T(m.he[0], m.en[0])}>${m.he[0]}</h3><p ${T(m.he[1], m.en[1])}>${m.he[1]}</p></div>`).join('');
let he = true;
document.getElementById('lang').onclick = (e) => {
  he = !he;
  document.documentElement.lang = he ? 'he' : 'en'; document.documentElement.dir = he ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-he]').forEach(x => { x.textContent = he ? x.dataset.he : x.dataset.en; });
  e.target.textContent = he ? 'English' : 'עברית';
};
</script>
</body>
</html>
