<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidTooList — round 3</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --s1: #1b1c1f; --ink: #ECE9E2; --mut: #9a968e; --acc: #F2A33A; --line: #2f3135; --eng: #d2cdc3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c0d0f; color: var(--ink); font-family: Heebo, sans-serif; padding: 18px 16px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header.top { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
  header.top h1 { font-size: 22px; margin: 0; flex: 1; }
  button.lang { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 10px; border: 1px solid #fff3; background: #1b1c1f; color: #fff; cursor: pointer; }
  h2 { font-size: 19px; margin: 30px 0 4px; color: var(--acc); }
  p.lead { margin: 0 0 14px; color: var(--mut); font-size: 14.5px; line-height: 1.55; max-width: 780px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .opt { background: var(--s1); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .opt h3 { margin: 10px 0 2px; font-size: 15.5px; }
  .opt p { margin: 0; color: var(--mut); font-size: 13px; line-height: 1.5; }
  .tag { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: #2b2114; color: var(--acc); margin-top: 8px; }
  .stage { min-height: 170px; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; direction: ltr;
    background: linear-gradient(180deg, #1e1f22, #121315); box-shadow: inset 0 1px 0 #ffffff10; padding: 14px 8px; }
  svg { display: block; max-width: 100%; height: auto; }
  .icons { display: flex; gap: 16px; justify-content: center; padding: 6px 0; direction: ltr; }
  .ico { width: 104px; height: 104px; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, #2a2c30, #131416); box-shadow: inset 0 1px 0 #ffffff14, 0 12px 24px -12px #000; }
  .ico.sm { width: 62px; height: 62px; border-radius: 15px; }
  .ico svg { width: 100%; height: 100%; }
  .lbl { text-align: center; font-size: 11.5px; color: var(--mut); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1 data-he="VidTooList · סבב 3" data-en="VidTooList · round 3">VidTooList · סבב 3</h1>
  <button class="lang" id="lang">English</button>
</header>
<p class="lead" data-he="לפי ההערות שלך: B עם ה-i כקו סימון של הפוקוס וטבעת צמצם מתחת, מצלמת פילם שה-OO שלה הם שני מגזינים, ו-C בגרסה קצרה. ולסמל, עוד כיוונים סביב הפריים והאינסוף (מספר III), בלי מחוגת הצמצם." data-en="From your notes: B with the i as the focus witness line and an iris ring below, a film camera whose OO are two magazines, and a shorter C. For the mark, more around the frame and infinity (No. III), without the iris dial.">לפי ההערות שלך: B עם ה-i כקו סימון של הפוקוס וטבעת צמצם מתחת, מצלמת פילם שה-OO שלה הם שני מגזינים, ו-C בגרסה קצרה. ולסמל, עוד כיוונים סביב הפריים והאינסוף (מספר III), בלי מחוגת הצמצם.</p>

<h2 data-he="1 · השם" data-en="1 · The name">1 · השם</h2>
<div class="grid" id="names"></div>
<h2 data-he="2 · הסמל" data-en="2 · The mark">2 · הסמל</h2>
<div class="grid" id="marks"></div>
</div>

<script>
const A = '#F2A33A', E = '#d2cdc3', M = '#8f8b84', F = "'Barlow Condensed', sans-serif";
// Letter metrics for Barlow Condensed 500 at 54px with .12em tracking — laid out by hand so every
// mark can sit exactly on a letter.
const txt = (x, y, s, size = 54, fill = E, extra = '') => `<text x="${x}" y="${y}" font-family="${F}" font-weight="500" font-size="${size}" fill="${fill}" ${extra}>${s}</text>`;
const scale = (x0, x1, y, labels, hiIdx, flip = false) => {
  const step = (x1 - x0) / (labels.length - 1);
  let s = '';
  for (let x = x0; x <= x1 + .1; x += step / 5) s += `<line x1="${x.toFixed(1)}" y1="${y}" x2="${x.toFixed(1)}" y2="${y + (flip ? -1 : 1) * ((Math.abs(((x - x0) / step) % 1) < .05 || Math.abs(((x - x0) / step) % 1) > .95) ? 9 : 5)}" stroke="${M}" stroke-width="1.2"/>`;
  labels.forEach((l, i) => { s += txt(x0 + i * step, flip ? y + 22 : y - 8, l, 15, i === hiIdx ? A : M, 'text-anchor="middle" letter-spacing="1"'); });
  return s;
};
const infPath = (cx, cy, w, sw = 5, c = A) => { const k = w / 24; return `<path transform="translate(${cx - 12 * k} ${cy - 6 * k}) scale(${k})" d="M23.00 6.00 L22.88 7.18 L22.52 8.28 L21.96 9.22 L21.25 9.96 L20.46 10.47 L19.62 10.76 L18.78 10.86 L17.96 10.79 L17.19 10.58 L16.46 10.27 L15.78 9.87 L15.14 9.40 L14.55 8.89 L14.00 8.35 L13.47 7.78 L12.97 7.19 L12.48 6.60 L12.00 6.00 L11.52 5.40 L11.03 4.81 L10.53 4.22 L10.00 3.65 L9.45 3.11 L8.86 2.60 L8.22 2.13 L7.54 1.73 L6.81 1.42 L6.04 1.21 L5.22 1.14 L4.38 1.24 L3.54 1.53 L2.75 2.04 L2.04 2.78 L1.48 3.72 L1.12 4.82 L1.00 6.00 L1.12 7.18 L1.48 8.28 L2.04 9.22 L2.75 9.96 L3.54 10.47 L4.38 10.76 L5.22 10.86 L6.04 10.79 L6.81 10.58 L7.54 10.27 L8.22 9.87 L8.86 9.40 L9.45 8.89 L10.00 8.35 L10.53 7.78 L11.03 7.19 L11.52 6.60 L12.00 6.00 L12.48 5.40 L12.97 4.81 L13.47 4.22 L14.00 3.65 L14.55 3.11 L15.14 2.60 L15.78 2.13 L16.46 1.73 L17.19 1.42 L17.96 1.21 L18.78 1.14 L19.62 1.24 L20.46 1.53 L21.25 2.04 L21.96 2.78 L22.52 3.72 L22.88 4.82 L23.00 6.00Z" fill="none" stroke="${c}" stroke-width="${sw / k}" stroke-linecap="round"/>`; };
// an i drawn as a mark: a stem and a dot, in amber
const iMark = (x, yTop, yBot, dot, c = A) => `<line x1="${x}" y1="${yTop}" x2="${x}" y2="${yBot}" stroke="${c}" stroke-width="5.5"/><circle cx="${x}" cy="${dot}" r="4.6" fill="${c}"/>`;

// The word as pieces, x positions in a 520-wide box, baseline y.
const word = (y, { oo = 'inf', iVid = 'text', iList = 'text', size = 54 } = {}) => {
  let s = txt(20, y, 'V') + (iVid === 'text' ? txt(58, y, 'I') : '') + txt(82, y, 'D') + txt(124, y, 'T');
  if (oo === 'inf') s += infPath(205, y - 19, 70, 4.2);
  s += txt(262, y, 'L') + (iList === 'text' ? txt(296, y, 'I') : '') + txt(320, y, 'S') + txt(360, y, 'T');
  return s;
};
const SVG = (h, inner, w = 420) => `<svg viewBox="0 0 ${w} ${h}" width="${w}">${inner}</svg>`;

const NAMES = [
  { pick: true,
    svg: SVG(190, scale(30, 390, 34, ['0.6', '0.8', '1', '1.5', '2', '3', '5', '∞'], 7)
      + word(118, { iVid: 'mark' }) + iMark(66, 76, 118, 86)
      + `<line x1="66" y1="44" x2="66" y2="70" stroke="${A}" stroke-width="2"/>`
      + scale(30, 390, 160, ['T1.4', '2', '2.8', '4', '5.6', '8', '11', '16'], 1, true).replace(/y2="(\d+(\.\d+)?)"/g, (m, v) => m)
      .replace(/<line ([^>]*)y1="160"/g, '<line $1y1="160"')),
    he: ['B1 · טבעת פוקוס וטבעת צמצם', 'מעל השם סקאלת פוקוס, ומתחתיו טבעת צמצם עם ערכי T. ה-I של VID הוא קו הסימון הכתום של הפוקוס, וה-OO הוא ∞.'],
    en: ['B1 · Focus ring and iris ring', 'A focus scale above the name and an iris ring with T-stops below. VID\'s I is the amber focus witness line, and the OO is ∞.'] },
  { pick: true,
    svg: SVG(196, scale(30, 390, 34, ['0.6', '0.8', '1', '1.5', '2', '3', '5', '∞'], 7)
      + word(118, { iVid: 'mark', iList: 'mark' }) + iMark(66, 76, 118, 86)
      + `<line x1="66" y1="44" x2="66" y2="70" stroke="${A}" stroke-width="2"/>`
      + iMark(304, 76, 118, 108).replace('cy="108"', 'cy="132"').replace('y1="76" x2="304" y2="118"', 'y1="76" x2="304" y2="124"')
      + `<line x1="304" y1="138" x2="304" y2="152" stroke="${A}" stroke-width="2"/>`
      + scale(30, 390, 160, ['T1.4', '2', '2.8', '4', '5.6', '8', '11', '16'], 7, true)),
    he: ['B2 · שני ה-i כשני סימונים', 'ה-I של VID מצביע למעלה אל טבעת הפוקוס, וה-I של LIST מתהפך ומצביע למטה אל טבעת הצמצם, כמו ה-i ההפוך שביקשת. עדשת קולנוע שלמה בתוך השם.'],
    en: ['B2 · Both i\'s as marks', 'VID\'s I points up to the focus ring, and LIST\'s I turns over and points down to the iris ring, as you asked. A whole cine lens inside the name.'] },
  { svg: SVG(150, scale(30, 390, 30, ['1', '2', '3', '5', '10', '∞'], 5) + word(112, { iVid: 'mark' }) + iMark(66, 70, 112, 80) + `<line x1="66" y1="40" x2="66" y2="64" stroke="${A}" stroke-width="2"/>`),
    he: ['B3 · רק טבעת הפוקוס', 'הגרסה הנקייה: טבעת אחת, ה-I הוא קו הסימון. קל יותר לשים בכותרת של האפליקציה.'],
    en: ['B3 · Focus ring only', 'The clean version: one ring, the I is the witness line. Easier in the app\'s top bar.'] },
  { svg: SVG(190, (() => {
      const mag = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="34" fill="#1b1c1f" stroke="${E}" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="9" fill="none" stroke="${A}" stroke-width="4"/>${[0, 120, 240].map(a => `<circle cx="${(cx + 20 * Math.cos(a * Math.PI / 180)).toFixed(1)}" cy="${(cy + 20 * Math.sin(a * Math.PI / 180)).toFixed(1)}" r="6" fill="none" stroke="${E}" stroke-width="2.5"/>`).join('')}`;
      return `<rect x="14" y="96" width="370" height="76" rx="10" fill="#18191c" stroke="${E}" stroke-width="3"/>
        <rect x="384" y="112" width="26" height="44" rx="4" fill="#18191c" stroke="${E}" stroke-width="3"/>
        ${mag(176, 62)}${mag(248, 62)}
        <path d="M176 96 Q212 120 248 96" fill="none" stroke="${A}" stroke-width="3"/>
        ${txt(36, 152, 'VIDT', 50, E, 'letter-spacing="6"')}${txt(276, 152, 'LIST', 50, E, 'letter-spacing="6"')}
        <circle cx="366" cy="110" r="5" fill="#ff3b30"/>`;
    })()),
    he: ['B4 · מצלמת פילם', 'הרעיון שלך: השם כתוב על גוף של מצלמת פילם, וה-OO הם שני המגזינים שיושבים עליה, עם הפילם שעובר ביניהם. נורית REC וחזית עדשה בצד.'],
    en: ['B4 · Film camera', 'Your idea: the name sits on a film camera body, and the OO are the two magazines on top, with the film running between them. A REC light and a lens front at the side.'] },
  { svg: SVG(150, (() => {
      const y = 108;
      return txt(20, y, 'VID') + txt(112, y, 'T', 54, A) + infPath(184, y - 19, 58, 4.2, E)
        + `<path d="M226 ${y - 52} V${y} H252" fill="none" stroke="${A}" stroke-width="6.5"/>` + txt(262, y, 'IST');
    })()),
    he: ['C2 · T∞L מסגרת קצרה', 'C בגרסה קצרה: ה-T וה-L בכתום, והם עצמם הפינות שממסגרות את ה-∞. בלי פינה נוספת בסוף, כך שהשם נשאר באורך רגיל.'],
    en: ['C2 · T∞L, a short frame', 'A shorter C: the T and the L in amber are themselves the corners framing the ∞. No extra corner at the end, so the name stays its normal length.'] },
];

// ---- marks: 120×120 boxes ----
const corners = (c = A, w = 7, inset = 20, len = 26) => `<path d="M${inset} ${120 - inset - len} V${120 - inset} H${inset + len}" fill="none" stroke="${c}" stroke-width="${w}"/><path d="M${120 - inset - len} ${inset} H${120 - inset} V${inset + len}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const MK = (inner) => `<svg viewBox="0 0 120 120">${inner}</svg>`;
const MARKS = [
  { svg: MK(corners() + infPath(60, 60, 46, 6, E)),
    he: ['III · פריים ואינסוף (המקורי)', 'הסמל שאהבת, להשוואה.'], en: ['III · Frame and infinity (original)', 'The one you liked, for comparison.'] },
  { pick: true, svg: MK(corners() + infPath(60, 64, 46, 6, E) + `<line x1="60" y1="24" x2="60" y2="44" stroke="${A}" stroke-width="5"/><circle cx="60" cy="17" r="4" fill="${A}"/>`),
    he: ['III-1 · עם ה-i כקו סימון', 'מעל ה-∞ עומד ה-i, כמו קו העד שבשם B. מחבר בין הסמל לשם.'],
    en: ['III-1 · With the i as witness line', 'The i stands above the ∞, like the witness line in name B. It ties the mark to the name.'] },
  { pick: true, svg: MK(`<path d="M26 34 H52 M39 34 V86" stroke="${A}" stroke-width="8" fill="none"/>` + infPath(70, 62, 30, 5, E) + `<path d="M86 34 V86 H100" stroke="${A}" stroke-width="8" fill="none"/>`),
    he: ['III-2 · T∞L', 'ה-T וה-L הם הפינות של הפריים, וה-∞ ביניהם. זה גם קיצור של השם, Tool ∞ List.'],
    en: ['III-2 · T∞L', 'The T and the L are the frame\'s corners with the ∞ between them. It also abbreviates the name, Tool ∞ List.'] },
  { svg: MK(corners() + `<circle cx="44" cy="58" r="17" fill="none" stroke="${E}" stroke-width="5"/><circle cx="76" cy="58" r="17" fill="none" stroke="${E}" stroke-width="5"/><circle cx="44" cy="58" r="4" fill="${A}"/><circle cx="76" cy="58" r="4" fill="${A}"/><path d="M44 75 Q60 90 76 75" fill="none" stroke="${A}" stroke-width="3.5"/>`),
    he: ['III-3 · מגזינים בפריים', 'שני מגזיני הפילם (ה-OO) בתוך הפריים, עם הפילם שעובר ביניהם. ממשיך את מצלמת הפילם B4.'],
    en: ['III-3 · Magazines in frame', 'The two film magazines (the OO) inside the frame, with film running between them. Follows the film camera B4.'] },
  { svg: MK(corners(A, 6, 18, 22) + infPath(60, 60, 44, 6, E) + `<circle cx="96" cy="96" r="6" fill="#ff3b30"/><text x="24" y="100" font-family="${F}" font-size="12" fill="${M}" letter-spacing="1">2.39</text>`),
    he: ['III-4 · עינית', 'הפריים כמסך של עינית: נורית REC בפינה ויחס 2.39. מרגיש הכי "על הסט".'],
    en: ['III-4 · Viewfinder', 'The frame as a viewfinder screen: a REC light in the corner and 2.39. Feels the most "on set".'] },
  { svg: MK(`<path d="M18 82 A48 48 0 0 1 102 82" fill="none" stroke="${E}" stroke-width="6"/>` + Array.from({ length: 9 }, (_, i) => { const a = Math.PI + i * Math.PI / 8; return `<line x1="${60 + 48 * Math.cos(a)}" y1="${82 + 48 * Math.sin(a)}" x2="${60 + 40 * Math.cos(a)}" y2="${82 + 40 * Math.sin(a)}" stroke="${M}" stroke-width="2"/>`; }).join('') + infPath(60, 62, 36, 5, A) + `<line x1="60" y1="88" x2="60" y2="104" stroke="${A}" stroke-width="5"/>`),
    he: ['III-5 · קשת פוקוס', 'קטע מטבעת הפוקוס עם שנתות, ה-∞ בראשה וקו עד מתחת. בלי פינות, יותר "עדשה" מ"פריים".'],
    en: ['III-5 · Focus arc', 'A slice of the focus ring with ticks, the ∞ on top and a witness line below. No corners: more lens than frame.'] },
];

const T = (he, en) => `data-he="${he.replace(/"/g, '&quot;')}" data-en="${en.replace(/"/g, '&quot;')}"`;
const tag = (p) => (p ? `<span class="tag" ${T('בין המומלצים', 'Recommended')}>בין המומלצים</span>` : '');
document.getElementById('names').innerHTML = NAMES.map(n => `<div class="opt"><div class="stage">${n.svg}</div>${tag(n.pick)}<h3 ${T(n.he[0], n.en[0])}>${n.he[0]}</h3><p ${T(n.he[1], n.en[1])}>${n.he[1]}</p></div>`).join('');
document.getElementById('marks').innerHTML = MARKS.map(m => `<div class="opt"><div class="icons"><div><div class="ico">${m.svg}</div><div class="lbl">VidTooList</div></div><div><div class="ico sm">${m.svg}</div><div class="lbl">Lens</div></div></div>${tag(m.pick)}<h3 ${T(m.he[0], m.en[0])}>${m.he[0]}</h3><p ${T(m.he[1], m.en[1])}>${m.he[1]}</p></div>`).join('');

let he = true;
document.getElementById('lang').onclick = (e) => {
  he = !he;
  document.documentElement.lang = he ? 'he' : 'en'; document.documentElement.dir = he ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-he]').forEach(x => { x.textContent = he ? x.dataset.he : x.dataset.en; });
  e.target.textContent = he ? 'English' : 'עברית';
};
</script>
</body>
</html>
